[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatwatch"
dynamic = ["version"]
description = "Let AI agents read and answer your Microsoft Teams chats through the Teams web page, with MCP tools and push handlers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
keywords = ["microsoft-teams", "mcp", "ai-agents", "chrome-devtools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

[project.scripts]
chatwatch = "chatwatch.__main__:main"

[tool.setuptools]
packages = ["chatwatch"]

[tool.setuptools.dynamic]
version = {attr = "chatwatch.__version__"}

[tool.setuptools.package-data]
chatwatch = ["web/*.html"]
